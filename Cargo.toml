[workspace]
resolver = "2"
members = ["crates/domain"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hound = "3.5"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "3", features = ["json"] }
base64 = "0.22"

friendly-voice-domain = { path = "crates/domain" }
friendly-voice-application = { path = "crates/application" }
friendly-voice-infrastructure = { path = "crates/infrastructure" }
