name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  MIN_SDK: "26"

jobs:
  build:
    name: Build Android (Rust library + APK)
    runs-on: ubuntu-latest
    env:
      # Release signing (optional). Configure in Settings → Secrets.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - name: Set up the Android NDK (preinstalled on the runner)
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "^3" --locked

      - name: Test the mobile bridge (host)
        run: cargo test -p friendly-voice-mobile

      - name: Build the native library (arm64-v8a, armeabi-v7a, x86_64)
        run: scripts/build-android.sh --rust-only

      - name: Build the CLI for Android/Termux (arm64)
        run: |
          cargo ndk -t arm64-v8a --platform "$MIN_SDK" \
            build --release -p friendly-voice --features http-engine

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: App version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.1.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
          echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Prepare the signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the APK (debug and release) and lint
        run: gradle -p android assembleDebug assembleRelease lint

      - uses: actions/upload-artifact@v4
        with:
          name: friendly-voice-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: friendly-voice-android-native
          path: |
            android/app/src/main/jniLibs/**
            target/aarch64-linux-android/release/friendly-voice

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

  release:
    name: Publish release (CD)
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir -p out
          find dist -name '*.apk' -exec cp {} out/ \;
          cp dist/friendly-voice-android-native/target/aarch64-linux-android/release/friendly-voice \
            out/friendly-voice-android-arm64
          ls -l out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
