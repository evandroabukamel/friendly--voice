[package]
name = "friendly-voice-infrastructure"
description = "Adapters: WAV, DSP, pt-BR G2P, JSON persistence, voice engines."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# HTTP adapter for a self-hosted neural voice cloning/synthesis server (see engine/).
http-engine = ["dep:ureq", "dep:base64"]

[dependencies]
friendly-voice-domain.workspace = true
friendly-voice-application.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
ureq = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
claxon = "0.4"

[dev-dependencies]
flacenc = { version = "0.5", default-features = false }
