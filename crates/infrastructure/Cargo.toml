[package]
name = "friendly-voice-infrastructure"
description = "Adaptadores: WAV, DSP, G2P pt-BR, persistência JSON, motores de voz."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Adaptador HTTP para um servidor de clonagem/síntese neural auto-hospedado.
http-engine = ["dep:ureq", "dep:base64"]

[dependencies]
friendly-voice-domain.workspace = true
friendly-voice-application.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
hound.workspace = true
ureq = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
