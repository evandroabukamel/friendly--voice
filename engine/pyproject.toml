[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friendly-voice-engine"
version = "0.2.0"
description = "Voice-cloning server for Friendly Voice: zero-shot cloning with Chatterbox Multilingual (23 languages)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.12"
# chatterbox-tts pins its own torch/torchaudio/transformers versions.
dependencies = [
    "chatterbox-tts==0.1.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.24",
    "soundfile>=0.12",
    "librosa>=0.10",
    "praat-parselmouth>=0.4.3",
]

[project.optional-dependencies]
# POST /v1/transcribe
transcribe = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
friendly-voice-engine = "friendly_voice_engine.__main__:main"

[tool.setuptools.packages.find]
include = ["friendly_voice_engine*"]
