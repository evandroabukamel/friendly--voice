[package]
name = "friendly_voice_bridge"
description = "flutter_rust_bridge API of the Flutter app: typed calls into the use cases."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
http-engine = ["friendly-voice-bootstrap/http-engine"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
friendly-voice-domain.workspace = true
friendly-voice-application.workspace = true
friendly-voice-bootstrap.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
