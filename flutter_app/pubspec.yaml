name: friendly_voice
description: "Friendly Voice — positive messages in the voice of someone you love."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0
  flutter: ^3.50.1

dependencies:
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_rust_bridge: 2.13.0
  flutter_soloud: ^5.3.1
  friendly_voice_bridge:
    path: rust_builder
  material_ui: ^1.11.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
